---
layout: default
---
<header class="masthead masthead--page">
  <div class="container container--text">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="display">{{ page.title | escape }}</h1>
    {%- if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </div>
</header>

<div class="container container--text page-body">
  <div class="prose">
    {{ content }}
  </div>
</div>
